databases:
  - name: job-tracker-db
    databaseName: job_tracker
    user: jobtracker
    plan: free
    postgresMajorVersion: "17"

services:
  - name: jbikong-job-tracker-api
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-tracker-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: https://jbikong-job-tracker-web.onrender.com

  - name: jbikong-job-tracker-web
    type: web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://jbikong-job-tracker-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
